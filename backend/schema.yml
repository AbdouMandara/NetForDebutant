components:
  schemas:
    AdminAnswer:
      type: object
      description: |-
        AnswerViewSet : permet à l'admin de créer/éditer avec question et is_correct.

        is_correct est retiré de la réponse pour les non-admins : seul l'admin
        doit voir quelle réponse est la bonne.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        answer_text:
          type: string
          maxLength: 200
        question:
          type: string
          format: uuid
        is_correct:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer_text
      - created_at
      - id
      - question
      - updated_at
    Answer:
      type: object
      description: |-
        Serializer public : n'expose PAS is_correct (le front ne doit pas
        pouvoir tricher en amont ; la correction passe par POST /tentatives/).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        answer_text:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer_text
      - created_at
      - id
      - updated_at
    AuthResponse:
      type: object
      description: |-
        Réponse commune de register / login / google_oauth.

        `refresh` n'est présent que pour les clients mobiles (en-tête
        `X-Client-Type: mobile`) : le web reçoit le refresh token dans le cookie
        `refresh_token` (httpOnly, chemin /api/v1/auth/).
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - message
      - user
    AuthUser:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - username
    Category:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        notions:
          type: array
          items:
            $ref: '#/components/schemas/Notion'
          readOnly: true
      required:
      - created_at
      - name
      - notions
      - slug
      - updated_at
    CsrfToken:
      type: object
      description: 'Réponse de GET /auth/csrf_token/ : à renvoyer dans l''en-tête
        X-CSRFToken.'
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Difficulty:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 20
        description:
          type: string
          nullable: true
      required:
      - id
      - name
    GoogleAuth:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
      required:
      - id_token
    Health:
      type: object
      description: Réponse de GET /health/ (health check public).
      properties:
        status:
          type: string
          description: « ok » si l'API répond, « unavailable » sinon.
        database:
          type: string
          description: « ok » si la base est joignable, « error » sinon.
      required:
      - database
      - status
    Logout:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    MesStatistiques:
      type: object
      description: Réponse de GET /users/mes-statistiques/.
      properties:
        score:
          type: integer
        total_tentatives:
          type: integer
        reponses_correctes:
          type: integer
        reponses_incorrectes:
          type: integer
        taux_reussite:
          type: number
          format: double
      required:
      - reponses_correctes
      - reponses_incorrectes
      - score
      - taux_reussite
      - total_tentatives
    Notion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        category:
          type: string
          format: uuid
        is_published:
          type: boolean
        photo:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          readOnly: true
      required:
      - category
      - created_at
      - id
      - questions
      - slug
      - title
      - updated_at
    NotionProgression:
      type: object
      description: |-
        Progression d'un apprenant sur UNE notion.

        Ce n'est pas un modèle : les valeurs sont calculées à la volée à partir de
        TentativeQuestion (voir UserViewSet.ma_progression).
      properties:
        notion:
          allOf:
          - $ref: '#/components/schemas/NotionRef'
          readOnly: true
        questions_total:
          type: integer
        questions_tentees:
          type: integer
        questions_reussies:
          type: integer
        progression:
          type: number
          format: double
        est_maitrisee:
          type: boolean
      required:
      - est_maitrisee
      - notion
      - progression
      - questions_reussies
      - questions_tentees
      - questions_total
    NotionRef:
      type: object
      description: Référence courte d'une notion (id, titre, slug) dans les réponses
        calculées.
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
      required:
      - id
      - slug
      - title
    PaginatedAdminAnswerList:
