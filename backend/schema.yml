  /api/v1/auth/google_oauth/:
    post:
      operationId: auth_google_oauth_create
      description: 'Connexion/inscription via Google : envoyer le `id_token` obtenu
        côté client (Google Identity Services). Throttle : 10/minute.'
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: 'Token CSRF (flux web uniquement), obtenu via GET /api/v1/auth/csrf_token/.
          Requis sauf si X-Client-Type: mobile.'
      - in: header
        name: X-Client-Type
        schema:
          type: string
          enum:
          - mobile
        description: Envoyer `mobile` désactive la vérification CSRF et fait renvoyer
          les tokens access/refresh dans le corps de la réponse (sinon le refresh
          part dans le cookie httpOnly `refresh_token`).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          description: No response body
        '409':
          description: No response body
