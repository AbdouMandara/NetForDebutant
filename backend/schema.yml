    get:
      operationId: users_ma_progression_list
      description: Progression de l'utilisateur connecté, notion par notion. Seules
        les notions publiées sont listées. Une notion est « maîtrisée » quand au moins
        `seuil` % de ses questions ont été réussies une fois au moins (une nouvelle
        tentative ratée ne dégrade pas le score d'une question).
      parameters:
      - in: query
        name: seuil
        schema:
          type: number
          format: float
          default: 70
        description: Pourcentage (0-100) de questions réussies requis pour considérer
          une notion comme maîtrisée. 400 si invalide.
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotionProgression'
          description: ''
