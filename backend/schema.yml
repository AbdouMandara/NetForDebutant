openapi: 3.0.3
info:
  title: NetForDebutant API
  version: 1.0.0
  description: |-
    API du quiz réseau pédagogique NetForDebutant.

    ## Consommer l'API depuis cette page (Swagger UI)

    **1. Se connecter** — `POST /api/v1/auth/login/` :
    - corps `{"email": "...", "password": "..."}`
    - ajoutez l'en-tête `X-Client-Type: mobile` (le plus simple ici : aucun CSRF, tokens renvoyés dans le corps)
    - copiez la valeur de `access` dans la réponse

    **2. S'authoriser** — bouton **Authorize** en haut à droite → collez le token (le préfixe `Bearer ` est ajouté automatiquement) → cliquez **Authorize** puis **Close**.

    **3. Consommer les endpoints protégés** — par ex. `GET /api/v1/categories/`, `GET /api/v1/questions/`, `POST /api/v1/tentatives/` : **Try it out** → **Execute** → 200. Sans le token : 401.

    ### Flux web (sans `X-Client-Type`)

    1. `GET /api/v1/auth/csrf_token/` → renvoie `csrfToken` et pose le cookie CSRF
    2. `POST /api/v1/auth/login/` avec l'en-tête `X-CSRFToken: <valeur>`
    3. l'access token est dans le corps, le refresh token dans le cookie `refresh_token` (chemin `/api/v1/auth/`)
    4. `POST /api/v1/auth/refresh/` renouvelle l'access token

    ### Limites de débit (throttle)

    - login : **5/min** — register : **3/h** — google_oauth : **10/min**
    - un 429 signifie trop de tentatives : attendez avant de réessayer

    Toutes les routes protégées attendent `Authorization: Bearer <access>`.
paths:
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
